name: SETU-DRR Multi-District Live Forecast Automation

on:
  schedule:
    # Runs twice a day: 00:20 and 12:20 UTC (5:50 AM and 5:50 PM IST)
    # Aligned ~20 mins after ECMWF global forecast model publication.
    # Non-quarter-hour offset avoids peak GitHub runner queue delays.
    - cron: '20 0,12 * * *'
  workflow_dispatch:
    inputs:
      district:
        description: 'Specific district slug (e.g. wayanad, barpeta) or leave empty for all'
        required: false
        default: ''
      dry_run:
        description: 'Simulate calculations without persisting database changes'
        required: false
        type: boolean
        default: false

jobs:
  trigger-forecast:
    name: Trigger Live Forecast Ingestion
    runs-on: ubuntu-latest
    steps:
      - name: Pre-Flight Warmup (Wake Render & NeonDB)
        run: |
          API_URL="${{ secrets.SETU_API_URL || 'https://the-dead-zone.onrender.com' }}"
          echo "Warming up backend instance at $API_URL/health..."

          # Render free instances spin down after 15m of inactivity.
          # Poll up to 24 times every 5 seconds (120s max window) until HTTP 200 is confirmed.
          READY=false
          for i in $(seq 1 24); do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$API_URL/health" || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Backend is warm and responsive (attempt $i)."
              READY=true
              break
            fi
            echo "Waiting for backend spin-up (attempt $i, status: $HTTP_STATUS)..."
            sleep 5
          done

          if [ "$READY" != "true" ]; then
            echo "::error::Backend did not wake up within 120s timeout window."
            exit 1
          fi

      - name: Send API Trigger Request
        run: |
          API_URL="${{ secrets.SETU_API_URL || 'https://the-dead-zone.onrender.com' }}"
          PAYLOAD='{"live": true, "dry_run": ${{ inputs.dry_run || false }}}'
          if [ -n "${{ inputs.district }}" ]; then
            PAYLOAD=$(jq -n --arg d "${{ inputs.district }}" --argjson dr "${{ inputs.dry_run || false }}" '{district: $d, live: true, dry_run: $dr}')
          fi

          echo "Triggering forecast ingestion at $API_URL/alerts/forecast/trigger..."
          RESPONSE=$(curl -s --max-time 60 --retry 3 --retry-delay 5 -w "\n%{http_code}" -X POST "$API_URL/alerts/forecast/trigger" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: $HTTP_STATUS"
          echo "Response: $BODY"

          # 200/202: Accepted & dispatched
          # 409: Ingestion cycle already executing in the background (idempotent success)
          if [ "$HTTP_STATUS" = "202" ] || [ "$HTTP_STATUS" = "200" ]; then
            echo "Forecast trigger accepted successfully."
          elif [ "$HTTP_STATUS" = "409" ]; then
            echo "Notice: A forecast cycle is already executing in the background (HTTP 409). Handled idempotently."
          else
            echo "::error::Forecast trigger failed with status $HTTP_STATUS"
            exit 1
          fi

      - name: Verify Forecast Telemetry
        if: success()
        run: |
          API_URL="${{ secrets.SETU_API_URL || 'https://the-dead-zone.onrender.com' }}"
          echo "Fetching latest forecast pipeline telemetry..."
          sleep 10
          STATUS_RESP=$(curl -s --max-time 15 "$API_URL/alerts/forecast/status" || echo "{}")
          echo "$STATUS_RESP" | jq . || echo "$STATUS_RESP"
